<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta id="theme-color-meta" name="theme-color" content="#f8f7f3"><meta name="description" content="FAMOUS — a choice-driven social fame simulator. Build a fictional identity, make friends, and live with the consequences."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>FAMOUS — Your life, in public</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script>try{const mode=localStorage.getItem('famous-theme-mode-v1')||localStorage.getItem('famous-theme-v1')||'system';const dark=mode==='dark'||(mode==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.documentElement.dataset.themeMode=mode}catch{document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.themeMode='system'}</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="Famous home"><span class="brand-mark">F</span><span>FAMOUS<span class="brand-period">.</span></span></a>
      <div class="top-context"><span class="live-dot"></span><span id="chapter-label">YOUR STORY STARTS HERE</span></div>
      <div class="top-actions"><button class="icon-button" id="sound-toggle" aria-label="Toggle sound" title="Sound">♫</button><button class="icon-button" id="help-button" aria-label="How to play" title="How to play">?</button><button class="icon-button theme-toggle" id="theme-toggle" data-theme-toggle aria-label="Switch to dark theme" title="Switch to dark theme">◐</button><button class="avatar avatar-self" id="top-avatar" data-nav="profile" aria-label="Your profile">Y</button></div>
    </header>
    <main id="screen" tabindex="-1"></main>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Game navigation"></nav>
    <div id="toast-region" aria-live="polite" class="toast-region"></div>
    <div id="modal-root"></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
